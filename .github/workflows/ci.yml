name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]
  schedule:
    # Daily mainnet parity check: catches bridge upgrades or RPC behaviour changes.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  svm:
    name: Claims against the real mainnet program (LiteSVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fetches the live program binary and accounts from public mainnet RPCs, then executes
      # every claim strategy locally in LiteSVM. Nothing touches mainnet state.
      - run: npm run test:svm

  live:
    name: Live mainnet parity (read-only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live
